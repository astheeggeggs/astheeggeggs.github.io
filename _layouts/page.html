---
layout: default
---
<section class="page-hero">
  <div class="wrap">
    <div class="eyebrow"><span class="pulse"></span>{{ page.eyebrow | default: 'Oxford' }}</div>
    <h1><span class="shine">{{ page.title | escape }}</span></h1>
    {% if page.subtitle %}<p class="lede">{{ page.subtitle }}</p>{% endif %}
  </div>
</section>
<section style="padding-top:1rem;">
  <div class="wrap">{{ content }}</div>
</section>
