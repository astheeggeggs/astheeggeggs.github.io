<div class="progress" id="progress"></div>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="dot"></span>{{ site.title | escape }}
    </a>
    <nav class="site-nav">
      {% for item in site.nav %}
        <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} class="is-active"{% endif %}>{{ item.name }}</a>
      {% endfor %}
      <a href="{{ site.links.scholar }}" target="_blank" rel="noopener">Scholar</a>
    </nav>
  </div>
</header>
